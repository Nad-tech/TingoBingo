<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f0">
  <title>Task list</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #20231f;
      background: #f5f4f0;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --muted: #777b74;
      --line: #e8e7e1;
      --green: #39745b;
      --green-dark: #285b45;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 72px 20px;
    }

    main {
      width: min(100%, 600px);
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 3.5rem);
      font-weight: 700;
      letter-spacing: -0.065em;
      line-height: 1.05;
    }

    .intro {
      margin: 14px 0 32px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    form {
      display: flex;
      gap: 10px;
      padding: 8px;
      border: 1px solid #e5e4dd;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 8px 24px rgb(32 35 31 / 4%);
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 0;
      outline: 0;
      background: transparent;
      color: inherit;
      font: inherit;
    }

    input[type="text"]::placeholder { color: #a1a39d; }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .add-button {
      padding: 11px 18px;
      border-radius: 11px;
      background: var(--green);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 650;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(0.97); }

    :focus-visible {
      outline: 3px solid #83b99e;
      outline-offset: 3px;
    }

    .list-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 30px 2px 12px;
    }

    h2 {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
    }

    #task-count {
      color: var(--muted);
      font-size: 0.82rem;
    }

    #task-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 62px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      animation: arrive 180ms ease-out;
    }

    .task input {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--green);
      cursor: pointer;
    }

    .task-label {
      flex: 1;
      overflow-wrap: anywhere;
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .task.is-complete .task-label {
      color: #969991;
      text-decoration: line-through;
      text-decoration-color: #afb2ab;
    }

    .delete-button {
      display: grid;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 9px;
      background: transparent;
      color: #858981;
      font-size: 1.2rem;
      line-height: 1;
      transition: background 150ms ease, color 150ms ease;
    }

    .delete-button:hover {
      background: #fbefec;
      color: #a34232;
    }

    #empty-state {
      padding: 28px 16px;
      border: 1px dashed #d9d9d1;
      border-radius: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      text-align: center;
    }

    #storage-message {
      min-height: 1.25em;
      margin: 14px 2px 0;
      color: #a34232;
      font-size: 0.82rem;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 48px 18px; }
      .intro { margin-bottom: 26px; }
      .add-button { padding-inline: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">To Do</p>
    <h1>Task list</h1>
    <p class="intro">Add a task.</p>

    <form id="task-form">
      <input id="task-input" type="text" maxlength="200" placeholder="What needs doing?" aria-label="New task" required>
      <button class="add-button" type="submit">Add task</button>
    </form>

    <section aria-labelledby="list-title">
      <div class="list-heading">
        <h2 id="list-title">Your tasks</h2>
        <span id="task-count" aria-live="polite"></span>
      </div>
      <ul id="task-list"></ul>
      <p id="empty-state">Nothing on your list yet. Add a task to get started.</p>
    </section>
    <p id="storage-message" role="status" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      const storageKey = "task-list-items";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const emptyState = document.querySelector("#empty-state");
      const storageMessage = document.querySelector("#storage-message");
      let tasks = [];

      try {
        const savedTasks = localStorage.getItem(storageKey);
        if (savedTasks !== null) {
          const parsedTasks = JSON.parse(savedTasks);
          if (!Array.isArray(parsedTasks) || !parsedTasks.every(task =>
            task && typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          )) {
            throw new Error("Saved task data is invalid.");
          }
          tasks = parsedTasks;
        }
      } catch (error) {
        storageMessage.textContent = "Saved tasks could not be read. Your changes may not persist.";
        console.error("Unable to load saved tasks:", error);
      }

      function saveTasks() {
        try {
          localStorage.setItem(storageKey, JSON.stringify(tasks));
          storageMessage.textContent = "";
        } catch (error) {
          storageMessage.textContent = "Tasks could not be saved. Check your browser's storage settings.";
          console.error("Unable to save tasks:", error);
        }
      }

      function renderTasks() {
        list.replaceChildren();
        emptyState.hidden = tasks.length > 0;

        const remaining = tasks.filter(task => !task.completed).length;
        count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;

        for (const task of tasks) {
          const item = document.createElement("li");
          item.className = `task${task.completed ? " is-complete" : ""}`;

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = task.completed;
          checkbox.setAttribute("aria-label", `Mark "${task.text}" as ${task.completed ? "not complete" : "complete"}`);
          checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
          });

          const label = document.createElement("span");
          label.className = "task-label";
          label.textContent = task.text;

          const deleteButton = document.createElement("button");
          deleteButton.className = "delete-button";
          deleteButton.type = "button";
          deleteButton.textContent = "\u00d7";
          deleteButton.setAttribute("aria-label", `Delete "${task.text}"`);
          deleteButton.addEventListener("click", () => {
            tasks = tasks.filter(savedTask => savedTask.id !== task.id);
            saveTasks();
            renderTasks();
          });

          item.append(checkbox, label, deleteButton);
          list.append(item);
        }
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }

        tasks.unshift({
          id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false
        });
        saveTasks();
        renderTasks();
        form.reset();
        input.focus();
      });

      renderTasks();
    })();
  </script>
</body>
</html>
